name: 🚀 Deploy .NET 8 SMMS.API to IIS on VPS

on:
  push:
    branches: [ "main" ]

jobs:
  build-and-deploy:
    runs-on: [self-hosted, windows]

    env:
      PUBLISH_PATH: "C:\\inetpub\\wwwroot\\PublishSMMS"

    steps:
      - name: 📥 Checkout source code
        uses: actions/checkout@v3

      - name: 🧪 Kiểm tra file dự án .csproj
        run: dir /s /b *.csproj

      - name: 📦 Restore NuGet packages
        run: dotnet restore ./BE/SMMS.API/SMMS.API/SMMS.API.csproj

      - name: 🛑 Stop IIS AppPool before cleaning
        shell: powershell
        run: |
          Import-Module WebAdministration
          $appPoolPath = "IIS:\AppPools\SMMSAPI"
          if (Test-Path $appPoolPath) {
            $appPool = Get-Item $appPoolPath
            if ($appPool.State -ne "Stopped") {
              $appPool.Stop()
              Write-Host "AppPool 'SMMSAPI' has been stopped."
            } else {
              Write-Host "AppPool 'SMMSAPI' was already stopped."
            }
          } else {
            Write-Host "AppPool 'SMMSAPI' does not exist."
          }

      - name: 🧹 Clean old publish directory
        shell: powershell
        run: |
          if (Test-Path "$env:PUBLISH_PATH") {
            Remove-Item -Recurse -Force "$env:PUBLISH_PATH\*" -ErrorAction SilentlyContinue
            Write-Host "Old files deleted from publish folder."
          } else {
            New-Item -Path "$env:PUBLISH_PATH" -ItemType Directory | Out-Null
            Write-Host "Created new publish folder."
          }

      - name: 🛠️ Build and Publish SMMS.API to IIS
        run: dotnet publish ./BE/SMMS.API/SMMS.API/SMMS.API.csproj -c Release -o "$env:PUBLISH_PATH"

      - name: 🔁 Restart IIS AppPool for SMMSAPI
        shell: powershell
        run: |
          Import-Module WebAdministration
          $appPoolPath = "IIS:\AppPools\SMMSAPI"
          if (Test-Path $appPoolPath) {
            $appPool = Get-Item $appPoolPath
            $appPool.Start()
            Write-Host "AppPool 'SMMSAPI' restarted."
          } else {
            Write-Host "AppPool 'SMMSAPI' does not exist."
          }

      - name: ✅ Verify publish result
        shell: powershell
        run: |
          Write-Host "✅ Files published to: $env:PUBLISH_PATH"
          Get-ChildItem "$env:PUBLISH_PATH" -Recurse
